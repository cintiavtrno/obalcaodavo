<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>O balcão da vó</title>
<meta name="description" content="O balcão da vó: jogo 2D em pixel art sobre o Pelourinho (Salvador), 1991–2000. Parte de O que a cidade mede.">
<!--GFONT-->
<style>
/*FONTS*/
html,body{margin:0;height:100%;touch-action:none;-webkit-tap-highlight-color:transparent;background:#120a05;overflow:hidden;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#120a05}
#game{width:100vw;height:100vh;height:100dvh;line-height:0;touch-action:none;-webkit-user-select:none;user-select:none}
#game canvas{display:block;outline:none}
#capa{position:fixed;inset:0;z-index:50;background:#120a05;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.2s ease}
#capa.on{opacity:1}#capa.out{opacity:0;transition:opacity .8s ease}
#capa{overflow:hidden}
#rot{display:none;position:fixed;inset:0;z-index:80;background:#120a05;color:#F5ECD8;align-items:center;justify-content:center;text-align:center;font:600 20px/1.4 'DMSans',system-ui,sans-serif;padding:24px}
#rot b{display:block;font-size:44px;margin-bottom:10px}
@media (orientation:portrait) and (max-width:900px){#rot{display:flex}}
#capa img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:0% 30%}
#capa button{position:absolute;left:0;top:0;font:700 16px/1.2 'DMSans',system-ui,sans-serif;color:#1C110A;background:#E3A63C;border:3px solid #1C110A;padding:12px 28px 15px;box-shadow:inset 0 3px 0 #F6CF7E,inset 0 -6px 0 #B9792A,0 6px 0 rgba(0,0,0,.5);cursor:wait;opacity:.55;transition:opacity .6s}
#capa button.ok{opacity:1;cursor:pointer}
#capa button.f2{background:#2A3548;color:#7FF0FF;box-shadow:inset 0 3px 0 #3E5068,inset 0 -6px 0 #151C26,0 6px 0 rgba(0,0,0,.5)}#capa button:hover{background:#F0B850}
#nocdn{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;color:#f4efe0;font:16px/1.5 'Atkinson',system-ui,sans-serif;padding:24px}
</style>
</head>
<body>
<div id="rot"><div><b>↻</b>Gire o celular ou o tablet para jogar na horizontal.</div></div>
<div id="capa"><img alt="O balcão da vó" src="/*CAPA*/"><button id="capaBtn" type="button">Carregando…</button><button id="capaF2" type="button" class="f2">Fase 2 · 2026</button></div>
<div id="wrap"><div id="game" role="application" aria-label="O balcão da vó"></div></div>
<div id="nocdn"><div>Não consegui carregar o Phaser (CDN).<br>Verifique a conexão e recarregue a página.</div></div>
<script>
var startF2go=false;(function(){const c=document.getElementById('capa'),b=document.getElementById('capaBtn'),b2=document.getElementById('capaF2'),t0=Date.now();let open=true;
 requestAnimationFrame(()=>c.classList.add('on'));
 // a capa cobre a tela toda (corta as bordas se preciso); o botão acompanha o ponto certo da arte
 const place=()=>{const W=innerWidth,H=innerHeight,s=Math.max(W/1600,H/900),ox=0,oy=(H-900*s)*.3;b.style.left=Math.round(ox+568*s)+'px';b.style.top=Math.round(oy+500*s)+'px';b.style.fontSize=Math.max(13,Math.round(22*s))+'px';b.style.padding=Math.round(10*s)+'px '+Math.round(24*s)+'px '+Math.round(13*s)+'px';b2.style.left=Math.round(ox+568*s)+'px';b2.style.top=Math.round(oy+590*s)+'px';b2.style.fontSize=Math.max(12,Math.round(18*s))+'px';b2.style.padding=Math.round(8*s)+'px '+Math.round(18*s)+'px '+Math.round(11*s)+'px'};
 place();addEventListener('resize',place);
 const ready=()=>{try{const u=window.__phaser&&window.__phaser.scene.getScene('UI');return!!(u&&u.hv)}catch(e){return false}};
 if(navigator.webdriver&&!/capa/.test(location.hash)){open=false;c.remove();return}
 const tick=setInterval(()=>{if(ready()&&Date.now()-t0>2500){b.classList.add('ok');b2.classList.add('ok');b.textContent=matchMedia('(pointer:coarse)').matches?'Começar':'Começar  [E]';clearInterval(tick)}},200);
 const go=()=>{if(!open||!b.classList.contains('ok'))return;open=false;c.classList.add('out');setTimeout(()=>c.remove(),850)};
 b.addEventListener('click',go);
 b2.addEventListener('click',()=>{if(!b2.classList.contains('ok'))return;try{history.replaceState(null,'','#2026')}catch(e){location.hash='2026'}if(window.__g&&!/2026/.test(location.hash))location.hash='2026';startF2go=true;go();try{window.__startF2&&window.__startF2()}catch(e){}});
 addEventListener('keydown',e=>{if(!open)return;e.stopImmediatePropagation();e.preventDefault();if(e.key==='e'||e.key==='E'||e.key==='Enter'||e.key===' ')go()},true);
})();
</script>
<!--PHASER-->
<script>/*ASSETS*/</script>
<script>/*JS*/</script>
</body>
</html>
